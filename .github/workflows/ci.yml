name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    name: API — typecheck · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image: the migrations run CREATE EXTENSION vector
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shoppan
          POSTGRES_PASSWORD: shoppan_test
          POSTGRES_DB: shoppan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoppan -d shoppan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shoppan:shoppan_test@localhost:5432/shoppan_test?schema=public
      JWT_SECRET: ci_test_secret_at_least_32_characters_long
      JWT_EXPIRES_IN: 1d
      COOKIE_NAME: shoppan_session
      CLIENT_ORIGIN: http://localhost:3000
      NODE_ENV: test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed reference data
        # Tests rely on the seeded plans and categories
        run: npx prisma db seed

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── Web ─────────────────────────────────────────────────────────────────────
  web:
    name: Web — typecheck · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  # ── Docker ──────────────────────────────────────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    # Only verifies the images build; nothing is pushed or deployed.
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t shoppan-api:ci ./apps/api

      - name: Build Web image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 \
            -t shoppan-web:ci \
            ./apps/web
